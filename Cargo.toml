[workspace]
resolver = "2"
members = ["crates/vs-core", "crates/vs-io", "crates/vs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
